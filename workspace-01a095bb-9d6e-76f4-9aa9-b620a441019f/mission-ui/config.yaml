# mission-ui config.yaml — UI + bridge config for arena/test1
# Configurable max height and camera FOV (matches mission_pi/config.yaml + cam.txt)

# --- Flight altitude (configurable max height) ---
flight:
  max_alt_m: 15.0          # <-- CHANGE THIS: 5 / 10 / 15 m (drone ceiling)
  default_sweep_alt_m: 15.0
  min_alt_m: 2.0
  # UI will clamp search altitude to max_alt_m and show warning if exceeded

# --- Camera FOV from cam.txt (for coverage planning) ---
cameras:
  # Pi Camera Module 3 Standard — cam.txt
  front:
    model: "Pi Camera Module 3 Standard"
    sensor: "IMX708"
    hfov_deg: 66.0          # ~66° HFOV from cam.txt
    vfov_deg: 41.0          # ~41° VFOV
    diagonal_fov_deg: 75.0  # 75° diagonal
    resolution: [4608, 2592]
    focal_mm: 4.74

  # Waveshare IMX477 IR-CUT B, 113° — cam.txt
  bottom:
    model: "Waveshare IMX477 IR-CUT B"
    sensor: "IMX477"
    hfov_deg: 100.0         # ~100° HFOV derived from 113° diagonal on 4:3
    vfov_deg: 75.0          # ~75° VFOV
    diagonal_fov_deg: 113.0 # 113° diagonal from cam.txt
    resolution: [4056, 3040]
    focal_mm: 2.7

# --- Polygon / Fence ---
polygon:
  # Polygon is the primary drawing that shows on Mission Planner
  # Button converts polygon -> fence inclusion (MAV_CMD 5001)
  default_mode: "polygon"   # polygon | fence
  show_on_mp: true          # polygon shows on MP via fence upload
  auto_convert: false       # if true, drawing polygon auto-uploads as fence

fence:
  type: "inclusion"         # inclusion (5001) | exclusion (5002)
  action: 1                 # 1=RTL, 2=LAND, etc
  enable_after_upload: true
  readback_verify: true

# --- Coverage planning (FOV-based) ---
coverage:
  mode: "fov_optimal"       # fov_optimal = max coverage using cam FOV per cam.txt
  overlap: 0.35             # 35% overlap for 15 m ensures no gaps with wind/GPS drift (0.30 for 10 m)
  min_overlap: 0.2
  cell_m: 5.0
  # Footprint math: w=2*alt*tan(HFOV/2), spacing=min(w,h)*(1-overlap)
  # Bottom 100° HFOV: at 15 m ~35.7×23.0 m spacing ~15 m (0.35 overlap), at 10 m ~23.8×15.3 m spacing ~10 m
  # Front 66° HFOV: at 15 m ~19.5×11.2 m spacing ~7.3 m — smaller, more legs, better for detail
  # For A3 QR 297×420 mm: at 15 m A3 ~34 px full-res, ~16 px on 640 input with 3×3 tiling — needs tiling

# --- Detection tuning for A3 at 10/15 m ---
detection:
  # A3 QR pixel budget: at 15 m bottom 35.7 m footprint 4056 px → 8.8 mm/px → A3 34 px
  # With 3×3 tiling: 34 px in tile → 16 px on 640 input — detectable if HEF trained on small QR
  # At 10 m: 50 px full-res → 23 px on 640 input — easier
  a3_size_m: [0.297, 0.42]
  conf_thr_15m: 0.25         # low for 15 m recall
  conf_thr_10m: 0.30
  conf_thr_5m: 0.35
  tile_bottom: true
  tile_grid: [3, 3]
  tile_overlap: 0.25
  search_speed_15m: 2.0      # slower for more frames
  search_speed_10m: 2.2
  resweep_alt: 10.0          # second grid at 10 m if 15 m fails — critical for reliability

# --- Bridge / MAVLink ---
bridge:
  mav_port: 14551
  host: "0.0.0.0"
  port: 8100
  sysid: 254

# --- Tiles ---
tiles:
  default_source: "offline-mbtiles"  # offline-mbtiles | osm | carto-dark
  auto_switch: true
