# config.10m.yaml — optimized for A3 QR detection at 10 m max altitude
# Use: python3 main.py --config config.10m.yaml
# Easier detection than 15 m, still good coverage — recommended for first real flight

server:
  host: 0.0.0.0
  port: 8000
stream:
  fps: 12
  width: 960
  quality: 70

flight:
  max_alt_m: 10.0
  min_alt_m: 2.0
  max_speed_ms: 3.0

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.0
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

cameras:
  front:
    model: "Pi Camera Module 3 Standard"
    sensor: "IMX708"
    size: [4608, 2592]
    hfov_deg: 66.0
    vfov_deg: 41.0
    diagonal_fov_deg: 75.0
    focal_length_mm: 4.74
    aperture: 1.8
    autofocus: true
    rotation_deg: 0
    jpeg_quality: 80
  bottom:
    model: "Waveshare IMX477 IR-CUT B"
    sensor: "IMX477"
    size: [2028, 1520]
    hfov_deg: 100.0
    vfov_deg: 75.0
    diagonal_fov_deg: 113.0
    focal_length_mm: 2.7
    aperture: 2.8
    autofocus: false
    ir_cut: true
    rotation_deg: 0
    jpeg_quality: 80
  single_cam_role: bottom

detector:
  kind: auto
  hef_path: models/qr_yolov8n.hef
  input_size: 640
  conf_thr: 0.30             # slightly higher than 15 m — balance FP
  iou_thr: 0.45
  tile_bottom: true
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3
  cue_frames: 2
  custom_module: myqr.det

decode:
  required_streak: 3
  miss_tolerance: 1

mission:
  max_alt_m: 10.0
  sweep_alt_m: 10.0
  approach_stair_m: [8.0, 6.0, 4.0]
  grid_overlap: 0.30
  edge_margin_m: 2.0
  resweep_alt_m: 7.0
  search_speed_ms: 2.2
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 600
  search_timeout_s: 300
  approach_timeout_s: 240
  min_batt_pct: 25
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  coverage_mode: "fov_optimal"
  min_overlap: 0.2

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0
