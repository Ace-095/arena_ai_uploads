# mission_pi config.yaml — main flight config with configurable max height
# Copy from config.example.yaml and tune per your venue + camera rig.
# All sections optional, but mission.max_alt_m is the single knob for altitude.

server:
  host: 0.0.0.0
  port: 8000

stream:
  fps: 12
  width: 960
  quality: 70

# --- Flight altitude config (NEW: configurable max height) ---
# max_alt_m is the hard ceiling — drone will never be commanded above this.
# sweep_alt_m is the search altitude, clamped to max_alt_m.
# Set max_alt_m to 5, 10, or 15 (or any value) as needed for your venue.
flight:
  max_alt_m: 15.0          # <-- CHANGE THIS: 5 / 10 / 15 m
  min_alt_m: 2.0
  max_speed_ms: 3.0

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.0
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2
  # camera FOV based coverage — footprint scales with altitude
  # ensures max area coverage according to cam.txt specs

cameras:
  # Pi Camera Module 3 Standard — from cam.txt
  # Sensor: IMX708, 11.9 MP, 4608x2592, 7.4mm diagonal, 1.4um pixels
  # Lens: 4.74mm f/1.8, 75° diagonal FoV, ~66° HFOV, ~41° VFOV, PDAF autofocus
  front:
    model: "Pi Camera Module 3 Standard"
    sensor: "IMX708"
    size: [4608, 2592]
    hfov_deg: 66.0           # from cam.txt: ~66° HFOV
    vfov_deg: 41.0           # from cam.txt: ~41° VFOV
    diagonal_fov_deg: 75.0   # from cam.txt: 75° diagonal
    focal_length_mm: 4.74
    aperture: 1.8
    autofocus: true
    rotation_deg: 0
    jpeg_quality: 80

  # Waveshare IMX477 IR-CUT Camera (B), 113° — from cam.txt
  # Sensor: IMX477, 12.3 MP, 4056x3040, 7.9mm diagonal, 1.55um pixels
  # Lens: 2.7mm f/2.8, 113° diagonal FoV, ~100° HFOV, fixed focus
  # 4:3 aspect, < -1.5% distortion, switchable IR-CUT
  bottom:
    model: "Waveshare IMX477 IR-CUT B"
    sensor: "IMX477"
    size: [4056, 3040]       # max res; use [2028, 1520] @40fps for search sweet spot
    hfov_deg: 100.0          # derived from 113° diagonal on 4:3: ~100° HFOV
    vfov_deg: 75.0           # derived: ~75° VFOV on 4:3
    diagonal_fov_deg: 113.0  # from cam.txt: 113° diagonal
    focal_length_mm: 2.7
    aperture: 2.8
    autofocus: false
    ir_cut: true
    rotation_deg: 0
    jpeg_quality: 80

  single_cam_role: bottom   # if only one CSI cam found, treat as bottom

detector:
  kind: auto                # auto | hailo | classical | custom | none
  hef_path: models/qr_yolov8n.hef
  input_size: 640
  conf_thr: 0.35
  iou_thr: 0.5
  tile_bottom: true         # tiled inference on bottom cam (the 15m answer)
  tile_grid: [3, 3]         # 3x3 needed for 113° lens; hailo/custom only
  full_decode_every_n: 5
  cue_frames: 2
  custom_module: myqr.det

decode:
  required_streak: 3
  miss_tolerance: 1

mission:
  # --- Configurable max height (clamped to flight.max_alt_m) ---
  max_alt_m: 15.0            # hard ceiling, same as flight.max_alt_m
  sweep_alt_m: 15.0          # search altitude — will be clamped to max_alt_m
  approach_stair_m: [12.0, 9.0, 7.0]  # descend while centered, also clamped
  grid_overlap: 0.3          # strip spacing = footprint * (1 - overlap)
  edge_margin_m: 2.0         # grid legs stop this far INSIDE fence
  resweep_alt_m: 10.0        # 2nd grid when 1st finds nothing (0 = disabled)
  search_speed_ms: 2.5
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 600
  search_timeout_s: 300
  approach_timeout_s: 240
  min_batt_pct: 25
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  # camera FOV based coverage: divide area according to cam footprint
  coverage_mode: "fov_optimal"   # fov_optimal = max coverage using cam FOV
  min_overlap: 0.2               # minimum overlap to ensure no gaps

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0
