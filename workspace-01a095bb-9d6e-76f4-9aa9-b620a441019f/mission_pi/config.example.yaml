# mission_pi config — copy to config.yaml and tune. All sections optional.
server:
  port: 8000

stream:
  fps: 12          # UI mjpeg tick (encoded once per cam, shared by all tiles)
  width: 960       # stream pixels only — capture/detect stay full-res
  quality: 70

cameras:
  front:  { size: [1920, 1080], hfov_deg: 66.0, rotation_deg: 0, jpeg_quality: 80 }
  bottom: { size: [2028, 1520], hfov_deg: 100.0, rotation_deg: 0, jpeg_quality: 80 }
  # bottom = Waveshare IMX477 IR-CUT B: 113 deg DIAGONAL, ~100 deg HFOV
  # (rectilinear approx on 4:3 — calibrate yours; approach geometry + grid
  # spacing scale with it!). 2028x1520@40 binned is the fps/range sweet spot
  # with 3x3 tiles; 4056x3040@10 full-res buys decode margin at 15 m.
  # Fixed focus (no AF) — verify 15 m sharpness with tools/cam_probe.py.
  # IR-CUT: leave in day mode for competition (IR needs an illuminator).
  # rotation_deg: physical mount twist (0/90/180/270) so image-up == nose.
  single_cam_role: bottom   # if only one CSI cam is found, treat it as this

detector:
  kind: auto                # auto | hailo | classical | custom | none
  hef_path: models/qr_yolov8n.hef
  input_size: 640
  conf_thr: 0.35
  iou_thr: 0.5
  tile_bottom: true         # tiled inference on bottom cam (the 15 m answer)
  tile_grid: [3, 3]         # rows x cols (113-deg lens needs 3x3; hailo/custom only)
  full_decode_every_n: 5    # full-frame decode attempt every Nth frame
  cue_frames: 2             # consecutive bbox frames to raise a flight cue
  custom_module: myqr.det   # kind=custom only: module with Detector/create_detector

decode:
  required_streak: 3        # matching decodes to CONFIRM a payload
  miss_tolerance: 1         # blank/disagreeing frames tolerated mid-streak

mission:
  sweep_alt_m: 15.0
  approach_stair_m: [12.0, 9.0, 7.0]  # descend while centered on the cue
  grid_overlap: 0.3      # strip spacing = footprint * (1 - overlap); scales to ANY fence size
  resweep_alt_m: 10.0    # 2nd grid when the 1st finds nothing (0 = disabled)
  search_speed_ms: 2.5   # WPNAV_SPEED during search, restored after (0 = FC default)
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 600
  search_timeout_s: 300  # ONE budget shared by yaw + grid + resweep
  approach_timeout_s: 240
  min_batt_pct: 25
  arrive_m: 2.0
  post_action: RTL          # RTL | AUTO (resume mission) | LOITER | LAND
  trigger_seq: null         # fallback if the plan has no sprayer item
  trigger_cmds: [216, 222, 223, 42600]  # DO_SPRAYER + ftest/ADDC fallbacks
  trigger_require_auto: true       # take over only out of AUTO
  trigger_peek_ahead: false        # true = fire when NEXT item is sprayer
                                   # (ftest/claude3 style; may pre-empt 15 m)

relay:
  interval_s: 2.0           # STATUSTEXT QR:<payload> resend cadence to MP
  window_s: 15.0            # ... for this long (plus instant ws event to UI)
