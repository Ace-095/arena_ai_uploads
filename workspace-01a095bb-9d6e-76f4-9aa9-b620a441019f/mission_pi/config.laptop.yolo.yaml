# Laptop YOLO config — Pop!_OS + webcam + YOLO QR detection
# USE THIS to see YOLO result on laptop (no Hailo needed)
#
# Install:
#   pip install ultralytics opencv-python-headless qrcode pillow
#   # or lighter: pip install onnxruntime opencv-python-headless
#
# Run:
#   python3 main.py --config config.laptop.yolo.yaml
#   # then open http://127.0.0.1:8000 — point webcam at printed A3 QR
#
# Test YOLO alone (without full mission):
#   python3 tools/test_yolo_laptop.py --source 0 --model models/qr_yolov8n.pt --conf 0.25
#   python3 tools/test_yolo_laptop.py --source 0 --model models/qr_yolov8n.onnx --onnx --conf 0.25 --tiled
#
# Bench YOLO vs classical at 10m/15m:
#   python3 tools/yolo_bench.py --model models/qr_yolov8n.pt --conf 0.25

server: { host: 0.0.0.0, port: 8000 }

stream:
  fps: 12
  width: 960
  quality: 70

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.0
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

fc:
  conn: "tcp:127.0.0.1:5762"

flight:
  max_alt_m: 15.0
  min_alt_m: 2.0

cameras:
  bottom:
    kind: usb
    device: 0
    size: [1280, 720]
    hfov_deg: 68.0
    rotation_deg: 0
    jpeg_quality: 80
    fps: 30
    backend: any
    fourcc: MJPEG
    qr_boost:
      enabled: true
      profile: "qr_boost_day"
      software_mode: "qr_boost"

qr_boost:
  enabled: true
  profile: "qr_boost_day"
  mode: "qr_boost_day"
  software_mode: "qr_boost"

detector:
  # YOLO laptop — USE THIS to see result on Pop!_OS
  kind: yolo                 # auto tries .pt -> .onnx -> ultralytics -> onnxruntime
  model_path: models/qr_yolov8n.pt   # or models/qr_yolov8n.onnx for onnxruntime
  hef_path: models/qr_yolov8n.hef    # for Pi5, ignored on laptop
  input_size: 640
  conf_thr: 0.25
  iou_thr: 0.45
  tile_bottom: true          # 3x3 tiling for small QR (34px@15m -> 15px on tile)
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3
  cue_frames: 2
  fake_filter:
    enabled: true
    hide_fake: true
    require_decode: true
    conf_thr: 0.35
    min_size: 15

  # Alternative explicit custom modules:
  # For ultralytics .pt:
  #   kind: custom
  #   custom_module: detectors.yolo_ultralytics
  #   model_path: models/qr_yolov8n.pt
  # For onnxruntime .onnx (lighter):
  #   kind: custom
  #   custom_module: detectors.yolo_onnx
  #   model_path: models/qr_yolov8n.onnx

decode:
  required_streak: 3
  miss_tolerance: 2

mission:
  max_alt_m: 15.0
  sweep_alt_m: 15.0
  approach_stair_m: [12.0, 9.0, 7.0]
  grid_overlap: 0.35
  edge_margin_m: 2.5
  resweep_alt_m: 10.0
  search_speed_ms: 2.0
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 900
  search_timeout_s: 240
  approach_timeout_s: 240
  min_batt_pct: 0
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  nofence_half_m: 20.0
  coverage_mode: "fov_optimal"
  min_overlap: 0.2

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0

presets:
  active: dark_qr_boost
  available: [daylight, dark, night, dark_qr_boost, qr_boost_day, qr_boost_night, gazebo_dark]
