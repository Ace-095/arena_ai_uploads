# config.15m.yaml — optimized for A3 QR detection at 15 m max altitude
# Use: python3 main.py --config config.15m.yaml
# This is max coverage per image, harder detection — needs tiling + low conf_thr + resweep at 10 m

server:
  host: 0.0.0.0
  port: 8000
stream:
  fps: 12
  width: 960
  quality: 70

flight:
  max_alt_m: 15.0
  min_alt_m: 2.0
  max_speed_ms: 3.0

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.5
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

cameras:
  front:
    model: "Pi Camera Module 3 Standard"
    sensor: "IMX708"
    size: [4608, 2592]
    hfov_deg: 66.0
    vfov_deg: 41.0
    diagonal_fov_deg: 75.0
    focal_length_mm: 4.74
    aperture: 1.8
    autofocus: true
    rotation_deg: 0
    jpeg_quality: 80
    qr_boost:
      enabled: true
      profile: "front_qr_boost"
      software_mode: "qr_boost"
  bottom:
    model: "Waveshare IMX477 IR-CUT B"
    sensor: "IMX477"
    size: [2028, 1520]       # 40 fps binned — SNR + fps for 15 m search
    hfov_deg: 100.0
    vfov_deg: 75.0
    diagonal_fov_deg: 113.0
    focal_length_mm: 2.7
    aperture: 2.8
    autofocus: false
    ir_cut: true
    rotation_deg: 0
    jpeg_quality: 80
    qr_boost:
      enabled: true
      profile: "bottom_qr_boost"
      software_mode: "ground_suppress"
  single_cam_role: bottom

qr_boost:
  enabled: true
  profile: "auto"
  mode: "qr_boost_day"
  software_mode: "qr_boost"

detector:
  kind: auto
  hef_path: models/qr_yolov8n.hef
  input_size: 640
  conf_thr: 0.25             # LOW for 15 m — more recall
  iou_thr: 0.45
  tile_bottom: true          # MANDATORY
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3
  cue_frames: 2
  fake_filter:
    enabled: true
    hide_fake: true
    require_decode: true
    conf_thr: 0.35
    min_size: 15
  custom_module: myqr.det

decode:
  required_streak: 3
  miss_tolerance: 2

mission:
  max_alt_m: 15.0
  sweep_alt_m: 15.0
  approach_stair_m: [12.0, 9.0, 7.0]
  grid_overlap: 0.35         # 35% overlap for 15 m
  edge_margin_m: 2.5
  resweep_alt_m: 10.0        # second grid at 10 m if first fails — critical
  search_speed_ms: 2.0       # slow for more frames
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 600
  search_timeout_s: 300
  approach_timeout_s: 240
  min_batt_pct: 25
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  coverage_mode: "fov_optimal"
  min_overlap: 0.2

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0

presets:
  active: dark_qr_boost
  available: [daylight, dark, night, dark_qr_boost, qr_boost_day, qr_boost_night, gazebo_dark]
