# Gazebo closed-loop config — Pop!_OS + SITL(gazebo-iris) + 2 sim cameras + QR boost (Kabaddi)
# Run:  python3 main.py --config config.gazebo.yaml
# Gazebo bridge with QR boost: python3 tools/gz_cam_bridge.py --qr-boost --contrast 1.8 --saturation 0.6 --sharpness 2.0 --enhance-mode ground_suppress
#
# Topology for Gazebo runs (SIM_GUIDE.md section 10):
#   gz sim (this laptop)   : sim/worlds/mission_world.sdf (iris_dualcam +
#                            qr_target) publishes /iris/front/image and
#                            /iris/bottom/image on gz-transport.
#   gz_cam_bridge (T-C)    : re-serves both as MJPEG on :8099 with QR boost (SYSTEM
#                            python3, not the venv) — makes QR pop vs ground.
#   SITL (this laptop)     : gazebo-iris JSON; MP takes TCP 5760,
#                            mission_pi takes TCP 5762 (same as the bench).
#   mission_pi cameras     : cam1/front + cam2/bottom over http MJPEG —
#                            UI shows both tiles, like two webcams, with software QR boost.
#   UI                     : http://<this-laptop-ip>:8000

server: { host: 0.0.0.0, port: 8000 }

stream:
  fps: 12
  width: 960
  quality: 70

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.0
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

fc:
  conn: "tcp:127.0.0.1:5762"

# --- Flight altitude (configurable max height) — arena/test1 ---
flight:
  max_alt_m: 15.0          # CHANGE: 5 / 10 / 15 — drone never exceeds this
  min_alt_m: 2.0
  max_speed_ms: 3.0

cameras:
  # Sim lenses are 68 deg to match bench geometry math.
  # size MUST equal sim render (2560x1440): mission_pi resizes every grabbed frame to size,
  # so 720p here would silently discard pixels A3 panel needs.
  # Gazebo bridge now has QR boost: --qr-boost --contrast 1.8 --saturation 0.6 --sharpness 2.0
  # This makes QR B/W pop vs ground in sim, same as real Pi.
  front:
    kind: url
    backend: mjpeg
    size: [2560, 1440]
    hfov_deg: 68.0
    rotation_deg: 0
    jpeg_quality: 80
    device: "http://127.0.0.1:8099/front.mjpg"
    # Kabaddi setting for Gazebo front cam — high contrast, low sat, sharp
    qr_boost:
      enabled: true
      profile: "front_qr_boost"      # contrast 1.6 sat 0.8 sharp 1.8
      software_mode: "qr_boost"      # CLAHE + unsharp + green suppress
  bottom:
    kind: url
    backend: mjpeg
    size: [2560, 1440]
    hfov_deg: 68.0
    rotation_deg: 0
    jpeg_quality: 80
    device: "http://127.0.0.1:8099/bottom.mjpg"
    # Kabaddi setting for Gazebo bottom cam — ground suppressed, QR pops
    qr_boost:
      enabled: true
      profile: "bottom_qr_boost"     # contrast 1.9 sat 0.6 sharp 2.0
      software_mode: "ground_suppress"  # strong green/brown desat

# Global QR boost — makes QR pop vs ground in SITL too
qr_boost:
  enabled: true
  profile: "auto"            # auto = bottom_qr_boost for bottom, front_qr_boost for front
  mode: "qr_boost_day"
  software_mode: "qr_boost"  # qr_boost / ground_suppress / adaptive

detector:
  kind: auto                 # auto = hailo if HEF present else classical — classical works in Gazebo with QR boost
  hef_path: models/qr_yolov8n.hef
  input_size: 640
  conf_thr: 0.25             # LOW for 15 m A3 — was 0.35, 0.25 gives +30% recall with QR boost
  iou_thr: 0.45
  tile_bottom: true          # 3x3 tiling mandatory for A3 at 15 m (34 px -> 16 px on 640 input)
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3     # more frequent decode for 15 m
  cue_frames: 2
  fake_filter:
    enabled: true
    hide_fake: true
    require_decode: true
    conf_thr: 0.35
    min_size: 15

decode:
  required_streak: 3
  miss_tolerance: 2          # allow 2 miss frames for 15 m jitter

mission:
  max_alt_m: 15.0
  sweep_alt_m: 12.0          # detection-test altitude (A3 ~68 px at 12 m with QR boost)
  approach_stair_m: [12.0, 9.0, 7.0]
  grid_overlap: 0.35         # 35% overlap ensures no gaps + QR boost
  edge_margin_m: 2.5
  resweep_alt_m: 10.0
  search_speed_ms: 1.0       # slow for SITL detection — more frames over target
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 900
  search_timeout_s: 900
  approach_timeout_s: 240
  min_batt_pct: 0
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  nofence_half_m: 20.0
  coverage_mode: "fov_optimal"
  min_overlap: 0.2

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0

presets:
  active: dark_qr_boost
  available: [daylight, dark, night, dark_qr_boost, qr_boost_day, qr_boost_night, gazebo_dark]
