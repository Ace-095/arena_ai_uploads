# Gazebo SITL + YOLO — USE THIS for real SITL+Gazebo test (instead of classical)
# YOLO mandatory for A3 at 10m/15m — classical FAILS at 34px/50px even with tiling+boost
# This config uses YOLO laptop detector (ultralytics .pt) which works on Pop!_OS without Hailo
#
# Run:
#   pip install ultralytics opencv-python-headless qrcode pillow
#   python3 tools/gz_cam_bridge.py --qr-boost --contrast 1.8 --saturation 0.6 --sharpness 2.0 &
#   gz sim sim/worlds/mission_world.sdf &
#   python3 main.py --config config.gazebo.yolo.yaml
#
# For ONNX (lighter, no torch):
#   pip install onnxruntime opencv-python-headless
#   Change detector.kind to custom + custom_module detectors.yolo_onnx + model_path models/qr_yolov8n.onnx

server: { host: 0.0.0.0, port: 8000 }

stream:
  fps: 12
  width: 960
  quality: 70

blob:
  enabled: true
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.0
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

fc:
  conn: "tcp:127.0.0.1:5763"  # FIX: use 5763 for Pi, 5762 for MP — avoids setWPTotal timeout + lag + 5760 conflict (SITL internal is 5760, don't use --out 5760)

flight:
  max_alt_m: 15.0
  min_alt_m: 2.0
  max_speed_ms: 3.0

cameras:
  front:
    kind: url
    backend: mjpeg
    size: [2560, 1440]
    hfov_deg: 68.0
    rotation_deg: 0
    jpeg_quality: 80
    device: "http://127.0.0.1:8099/front.mjpg"
    qr_boost:
      enabled: true
      profile: "front_qr_boost"
      software_mode: "qr_boost"
  bottom:
    kind: url
    backend: mjpeg
    size: [2560, 1440]
    hfov_deg: 68.0
    rotation_deg: 0
    jpeg_quality: 80
    device: "http://127.0.0.1:8099/bottom.mjpg"
    qr_boost:
      enabled: true
      profile: "bottom_qr_boost"
      software_mode: "ground_suppress"

qr_boost:
  enabled: true
  profile: "auto"
  mode: "qr_boost_day"
  software_mode: "qr_boost"

detector:
  # YOLO for Gazebo — USE THIS instead of classical for real SITL+Gazebo test
  # kind: yolo auto-detects .pt -> .onnx -> ultralytics -> onnxruntime
  kind: yolo
  model_path: models/qr_yolov8n.pt   # 24MB, needs ultralytics — or use models/qr_yolov8n.onnx (12MB, needs onnxruntime)
  hef_path: models/qr_yolov8n.hef    # kept for Pi5, but laptop uses pt/onnx
  input_size: 640
  conf_thr: 0.35             # 0.35 default kills grill fakes (your 0.16/0.24), 0.25 for max recall at 15m if you accept some fakes
  iou_thr: 0.45
  tile_bottom: true          # 3x3 tiling MANDATORY for A3 at 15m (34px -> 15px on 640 tile)
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3
  cue_frames: 2
  # --- FAKE FILTER — integrated preset workflow (kills window grill fakes) ---
  fake_filter:
    enabled: true            # enable fake filtering (aspect + size + low-conf)
    hide_fake: true          # hide orange non-decoded boxes (your grill)
    require_decode: false    # for Gazebo: false = show high-conf even if not decoded yet, true = ONLY decoded (zero fakes, best for ground)
    conf_thr: 0.35           # cue only if conf >= this (grill 0.16/0.24 blocked)
    min_size: 15             # min box px

# --- PRESET WORKFLOW — easy dark control + fake filter combined ---
# Presets: daylight, dark, night, dark_qr_boost, qr_boost_day, qr_boost_night, gazebo_dark
# Use via API: POST /api/camera/controls {cam: cam2, qr_boost_profile: dark_qr_boost}
# Or via tools: python3 tools/camera_tune.py --pi http://... --preset dark_qr_boost --cam cam2
# Or laptop test: python3 tools/test_yolo_webcam_qr.py --source 0 --preset dark_qr_boost --require-decode
presets:
  active: dark_qr_boost      # default preset for pitch dark ground
  available: [daylight, dark, night, dark_qr_boost, qr_boost_day, qr_boost_night, gazebo_dark]

decode:
  required_streak: 3
  miss_tolerance: 2

mission:
  max_alt_m: 15.0
  sweep_alt_m: 12.0
  approach_stair_m: [12.0, 9.0, 7.0]
  grid_overlap: 0.35
  edge_margin_m: 2.5
  resweep_alt_m: 10.0
  search_speed_ms: 1.0
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 900
  search_timeout_s: 900
  approach_timeout_s: 240
  min_batt_pct: 0
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  nofence_half_m: 20.0
  coverage_mode: "fov_optimal"
  min_overlap: 0.2

relay:
  interval_s: 2.0
  window_s: 15.0
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0
