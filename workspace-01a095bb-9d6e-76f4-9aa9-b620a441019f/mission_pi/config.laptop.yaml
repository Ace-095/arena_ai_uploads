# Laptop (Linux) bench config — Pop!_OS + SITL + laptop webcam.
# Copy to config.yaml or run:  python3 main.py --config config.laptop.yaml
#
# Topology for bench runs:
#   SITL (this laptop) : MP on Windows takes TCP 5760,
#                        mission_pi takes TCP 5762 (SITL serial1 default).
#   Webcam             : /dev/video0, pointed at the printed A3 QR panel.
#   UI                 : http://<this-laptop-ip>:8000

server: { host: 0.0.0.0, port: 8000 }

stream:
  fps: 12          # UI mjpeg tick (encoded once per cam, shared by all tiles)
  width: 960       # stream pixels only — capture/detect stay full-res
  quality: 70

fc:
  conn: "tcp:127.0.0.1:5762"   # SITL serial1 spare MAVLink port

cameras:
  # Only ONE camera on a laptop: the webcam is the bottom/search eye (cam2).
  # The UI shows a single tile for it (no mirror). Tune it live with the UI
  # CAMERAS sliders (POST /api/camera/controls, the contract path); static
  # boot values can still be baked here via `controls:` (raw driver props).
  bottom: { kind: usb, device: 0, size: [1280, 720], hfov_deg: 68.0,
            rotation_deg: 0, jpeg_quality: 80, fps: 30, backend: any,
            fourcc: MJPEG }
  # backend: any | dshow | msmf | v4l2 — if the tile stays dark, try dshow
  #   (Windows) or v4l2 (Linux). fourcc MJPEG keeps 720p30 inside USB2
  #   bandwidth; drop the line if your cam dislikes it.
  # Raw driver tuning (bench/SSH; the UI sliders are the normal path):
  #   curl http://localhost:8000/api/camera/cam2/controls
  #   curl -X POST http://localhost:8000/api/camera/cam2/controls \
  #     -H "Content-Type: application/json" -d '{"contrast":40}'
  # hfov_deg: measure YOUR webcam (most laptop cams are 60-75 deg).
  #   Wrong HFOV only skews approach geometry on the bench — the printed
  #   QR is found by pixels, not by geometry.
  #
  # Gazebo closed-loop: use config.gazebo.yaml instead (2 sim cameras
  #   over MJPEG from tools/gz_cam_bridge.py — SIM_GUIDE.md section 10).
  #   File playback for vision tests:
  #   bottom: { kind: file, path: bench_frames/, size: [1280, 720], fps: 5 }

detector:
  kind: classical            # laptop has no Hailo; stock YOLO knows no QR class
  conf_thr: 0.35
  iou_thr: 0.5
  tile_bottom: true          # skipped automatically for classical
  tile_grid: [3, 3]
  full_decode_every_n: 5
  cue_frames: 2

decode:
  required_streak: 3
  miss_tolerance: 1

mission:
  sweep_alt_m: 15.0
  approach_stair_m: [12.0, 9.0, 7.0]
  grid_overlap: 0.5
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 900
  search_timeout_s: 240
  approach_timeout_s: 240
  min_batt_pct: 0            # SITL battery game is silly; don't failsafe on it
  arrive_m: 2.0
  post_action: RTL
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  nofence_half_m: 20.0       # SITL has no fence: cover a 40x40 m home box

relay:
  interval_s: 2.0
  window_s: 15.0
