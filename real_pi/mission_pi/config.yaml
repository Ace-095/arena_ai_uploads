# ============================================================================
# real_pi — ONE config for the whole Pi 5 + Pixhawk + UI stack.
#
#   python3 main.py            # picks THIS file up (default config.yaml)
#
# Everything the stack does lives in this file: HTTP server, video stream
# (watchdog + adaptive), camera auto-detect, Pixhawk USB auto-connect, YOLO
# (Hailo first, CPU fallback), decode confirm, flight ceiling + sweep, and
# the two-stage QR -> Mission Planner relay.  Change a number, save, restart
# mission_pi — no code edits.
# ============================================================================

server:
  host: 0.0.0.0          # MUST be 0.0.0.0 — the laptop UI reaches the Pi over LAN
  port: 8000             # paste http://<pi-ip>:8000 into the UI's Pi-link box

# ----------------------------------------------------------------------------
# Video stream to the UI (this is the one that "always stuck" — fixed here)
#   * first_frame_wait_s : the stream waits this long for the first frame;
#                          still nothing -> 503 -> UI falls back to polling
#                          (a dead socket can never hold a tile hostage).
#   * watchdog_s         : camera frames older than this -> the stream
#                          thread RESTARTS the camera (bounded, cooled down).
#   * adaptive           : encoder watches its own load and degrades
#                          fps/width/quality under Pi 5 load (YOLO tiles!)
#                          instead of freezing; restores when headroom back.
# ----------------------------------------------------------------------------
stream:
  fps: 12                # UI MJPEG tick (1 encode per cam, shared by all tiles)
  width: 960             # stream pixels only — capture/detect stay FULL-res
  quality: 70
  watchdog_s: 6.0
  adaptive: true
  min_fps: 4
  min_width: 480
  min_quality: 40
  first_frame_wait_s: 8.0

# ----------------------------------------------------------------------------
# Cameras — AUTO-DETECT on the Pi 5 (CSI + USB, no manual device numbers)
#
# Each role (front/bottom) fills in this order:
#   1. explicit kind (usb/url/file/mirror) — if you set one, it wins;
#   2. CSI camera whose sensor matches `match_name` (picamera2/libcamera);
#   3. USB V4L2 camera matching `match_vidpid` (vvvv:pppp) or `match_name`
#      (substring of the USB product string);
#   4. the first remaining free USB capture node (deterministic order).
#
# Run  python3 tools/list_cams.py  to see exactly what THIS Pi sees and
# what it would assign to cam1/cam2.  Cameras are re-scanned every
# auto_rescan_s (hot-plug: unplug/replug a USB cam mid-mission works);
# POST /api/cameras/rescan forces it on demand.
# ----------------------------------------------------------------------------
cameras:
  auto_detect: true
  auto_rescan_s: 30          # 0 = disable the timer (manual rescan only)
  single_cam_role: bottom    # if exactly ONE camera is found, it is THIS role
  front:
    kind: auto               # auto | rpi | usb | url | file | mirror
    match_name: imx708       # CSI: "Pi Camera Module 3" (IMX708)
    match_vidpid: ""         # USB: e.g. "174c:55e8" (leave "" to auto-pick)
    size: [4608, 2592]
    hfov_deg: 66.0
    vfov_deg: 41.0
    autofocus: true
    rotation_deg: 0
    jpeg_quality: 80
    qr_boost:
      enabled: true
      profile: front_qr_boost
      software_mode: qr_boost
  bottom:
    kind: auto
    match_name: imx477       # CSI: Waveshare IMX477 IR-CUT B (113 deg diag)
    match_vidpid: ""
    size: [2028, 1520]       # 40 fps binned — SNR + fps sweet spot for 15 m
    hfov_deg: 100.0
    vfov_deg: 75.0
    diagonal_fov_deg: 113.0
    focal_length_mm: 2.7
    aperture: 2.8
    autofocus: false         # fixed focus — verify 15 m sharpness first!
    rotation_deg: 0
    jpeg_quality: 80
    qr_boost:
      enabled: true
      profile: bottom_qr_boost
      software_mode: ground_suppress

# Global QR boost defaults (per-role settings above win).
qr_boost:
  enabled: true
  profile: auto
  mode: qr_boost_day
  software_mode: qr_boost

# ----------------------------------------------------------------------------
# Pixhawk — AUTO-CONNECT over USB (cable straight into a Pi 5 USB port)
#
# Leave conn EMPTY for full auto-detect: /dev/serial/by-id/* (ArduPilot /
# Pixhawk names first — stable across re-plugs), then /dev/ttyACM*, then
# /dev/ttyUSB*. Every candidate is tried at every baud in `bauds` and the
# first one that answers a VEHICLE heartbeat wins.  Re-plug / reboot /
# port-change recovery: the FC watchdog (dead_s) notices a missing heartbeat
# and RE-DETECTS automatically (link_lost -> link_restored in the UI log).
#
#   conn: tcp:127.0.0.1:5762   # only for SITL/Gazebo bench
#   conn: /dev/ttyACM0         # or pin a specific device
# ----------------------------------------------------------------------------
fc:
  conn: ""                 # "" = AUTO-DETECT (the real-flight default)
  bauds: [115200, 57600, 921600]
  dead_s: 10.0             # no vehicle heartbeat for 10 s => link lost
  retry_s: 5.0             # reconnect cadence while the link is down
  connect_timeout_s: 0     # 0 = keep retrying forever (UI stays up either way)

# ----------------------------------------------------------------------------
# QR detection — YOLO, Hailo AI HAT FIRST, CPU fallback (no drone crash)
#
#   kind: auto ladder (every rung falls through to the next):
#     1. Hailo  : models/qr_yolov8n.hef + hailo_platform (the AI HAT)
#     2. ONNX   : models/qr_yolov8n.onnx + onnxruntime (light on ARM)
#     3. .pt    : models/qr_yolov8n.pt + ultralytics (torch, heavier)
#     4. classical: cv2 + pyzbar (no model — weak past ~8 m, day-one fallback)
#
# 15 m A3 panel answer: the bottom frame is run as a 3x3 TILE grid
# (tile_bottom) so a 34 px QR becomes ~150 px on the network input.
# ----------------------------------------------------------------------------
detector:
  kind: auto               # auto | hailo | yolo | classical | custom | none
  hef_path: models/qr_yolov8n.hef     # used by the Hailo rung (if present)
  prefer: [onnx, pt]       # CPU rung order (onnx first on the Pi 5)
  input_size: 640
  conf_thr: 0.25           # START value — the active preset (below) overrides
  iou_thr: 0.45            #   it at startup and on every preset switch
  preset: day              # ACTIVE qr_presets entry (runtime: POST /api/qr/preset)
  tile_bottom: true        # helps small QR candidates; cannot guarantee 15 m decode
  tile_front: false        # enable for distant Cam3 QRs; 3x3 = 9 inferences/frame
  tile_grid: [3, 3]
  tile_overlap: 0.25
  full_decode_every_n: 3   # full-frame decode attempt every Nth frame
  cue_frames: 2            # consecutive bbox frames to raise a flight cue

# ----------------------------------------------------------------------------
# FAKE-QR FILTER + ENVIRONMENT PRESETS (the window-grill fix)
#
# A diamond window grill read as "qr" at conf 0.16-0.24 and filled the view
# with orange boxes — useless on the ground. Every detector box must now
# pass these gates before it can draw an overlay or steer the drone:
#
#   min_conf           0.35  — above the grill band (real 15 m QRs score ~0.5)
#   min_side_px        15    — kill specks
#   aspect_min..max    0.4-2.5 — QRs are ~square; grill shards are diamonds
#   require_decode_for_cue — when true, a FLIGHT CUE only comes from a box
#                            that actually decoded a payload (only real QRs
#                            trigger the mission). Presets set this per
#                            environment (see below); the decode/consensus
#                            path was ALREADY decode-only.
#
# PRESETS: one named environment setting (detector conf, tile grid, decode
# cadence, cue strictness, ISP boost). Switch at runtime with
#   curl -X POST http://<pi>:8000/api/qr/preset -d '{"preset":"dark"}'
# or keys p / 1-7 in tools/test_yolo_webcam_qr.py.
#
# RECOMMENDED (from the field report):
#   * ground runs (kabaddi/night): preset `dark` or `kabaddi` — always
#     require-decode.  Night + tiled: conf 0.30 + dark boost.
#   * flight 15 m search: preset `day` (default).
# ----------------------------------------------------------------------------
qr_filter:
  min_conf: 0.35
  min_side_px: 15
  aspect_min: 0.4
  aspect_max: 2.5
  require_decode_for_cue: false

qr_presets:
  day:          # key 1 — daylight 15 m search (default)
    conf_thr: 0.35
    tile_grid: [3, 3]
    full_decode_every_n: 3
    require_decode_for_cue: false
    boost: qr_boost_day
    desc: "daylight 15 m search (default)"
  far:          # key 2 — max range, more recall
    conf_thr: 0.30
    tile_grid: [3, 3]
    full_decode_every_n: 3
    require_decode_for_cue: false
    boost: qr_boost_day
    desc: "max range 15 m — more recall, still above grill conf"
  dark:         # key 3 — night ground (a.k.a. dark_qr_boost)
    conf_thr: 0.30
    tile_grid: [3, 3]
    full_decode_every_n: 2
    require_decode_for_cue: true
    boost: qr_boost_lowlight
    desc: "night ground (dark_qr_boost) — only decodes count"
  kabaddi:      # key 4 — ground level, close range
    conf_thr: 0.30
    tile_grid: [1, 1]
    full_decode_every_n: 1
    require_decode_for_cue: true
    boost: qr_boost_lowlight
    desc: "ground level, close range — full frame, only real QRs trigger"
  low:          # key 5 — indoor low light
    conf_thr: 0.25
    tile_grid: [3, 3]
    full_decode_every_n: 2
    require_decode_for_cue: true
    boost: qr_boost_lowlight
    desc: "indoor low light — sensitive but strict on cues"
  aggressive:   # key 6 — bright high-contrast day
    conf_thr: 0.25
    tile_grid: [3, 3]
    full_decode_every_n: 2
    require_decode_for_cue: false
    boost: qr_boost_aggressive
    desc: "bright high-contrast day — detector sensitivity up"
  bench:        # key 7 — SITL/bench
    conf_thr: 0.35
    tile_grid: [1, 1]
    full_decode_every_n: 1
    require_decode_for_cue: false
    boost: normal
    desc: "SITL/bench — full frame, fastest, no boost"

# ----------------------------------------------------------------------------
# Decode confirm — how many CONSECUTIVE identical decodes confirm a payload
# (drives mission completion). The MP message itself does NOT wait for this:
# see `relay` below — QR_SEEN goes out on the very first decode.
# ----------------------------------------------------------------------------
decode:
  required_streak: 3
  miss_tolerance: 2        # blank/disagreeing frames tolerated mid-streak

# ----------------------------------------------------------------------------
# FLIGHT CEILING + SWEEP — "the config adjusts the drone's max and sweep"
#
#   flight.max_alt_m   : HARD ceiling — every altitude command the Pi sends
#                        (sweep, approach, resweep) is clamped to this.
#   mission.sweep_alt_m: the altitude the search grid actually flies.
#
# 15 m A3 setup (the target spec). Drop max_alt_m to 10 and sweep to 10 for
# the 10 m panel: detection margin improves, grid footprint shrinks — the
# grid spacing re-computes from your camera FOV automatically.
# ----------------------------------------------------------------------------
flight:
  max_alt_m: 15.0
  min_alt_m: 2.0
  max_speed_ms: 3.0

blob:
  enabled: true            # last-resort ground hypotheses after resweep
  top_k: 3
  per_candidate_s: 20
  global_cap_s: 60
  observe_every_s: 2.0
  min_support: 2
  cluster_radius_m: 2.5
  commit_score: 0.7
  trend_gain: 0.03
  trend_slack: 0.05

coverage:
  cell_m: 5.0
  push_every_s: 5.0
  center_tol_m: 3.0
  settle_s: 2.0
  max_misses: 2

mission:
  max_alt_m: 15.0          # ceiling (mirrors flight.max_alt_m)
  sweep_alt_m: 15.0        # search grid altitude (<= max_alt_m)
  approach_stair_m: [12.0, 9.0, 7.0]   # descend while centered on the cue
  grid_overlap: 0.35       # 35% overlap for the 15 m panel
  edge_margin_m: 2.5       # grid legs stop this far INSIDE the fence
  resweep_alt_m: 10.0      # 2nd grid at 10 m if the 1st finds nothing (0=off)
  search_speed_ms: 2.0     # slow during search = more frames over the QR
  yaw_steps: 12
  yaw_settle_s: 1.0
  trigger_timeout_s: 600
  search_timeout_s: 300    # ONE budget shared by yaw + grid + resweep
  approach_timeout_s: 240
  min_batt_pct: 25         # below this -> failsafe (RTL/land, no crash)
  arrive_m: 2.0
  link_timeout_s: 0        # 0 = WAIT FOREVER for the FC link (real-flight
                           # default: bring-up keeps retrying in the
                           # background; the UI stays up the whole time)
  post_action: RTL         # RTL | AUTO | LOITER | LAND after transmit
  trigger_seq: null
  trigger_cmds: [216, 222, 223, 42600]
  trigger_require_auto: true
  trigger_peek_ahead: false
  coverage_mode: fov_optimal
  min_overlap: 0.2
  # nofence_half_m: 50.0   # home box half-size when the FC has no fence

# ----------------------------------------------------------------------------
# QR -> Mission Planner: TWO-STAGE, NO DELAY
#
#   Stage 1 (announce): the FIRST single-frame decode puts
#             QR_SEEN:<payload> on MAVLink STATUSTEXT — the Pixhawk
#             forwards it to every GCS, so it lands in MP's Messages tab
#             within one telemetry tick (~50 ms over USB). Resent for
#             announce_window_s to survive one dropped packet.
#   Stage 2 (confirm) : when the confirm-streak completes,
#             QR:<payload> goes out immediately (NOT after the approach
#             descent) and is resent every interval_s for window_s.
#   store_forward     : if BOTH routes are down, the result is buffered to
#                       disk and flushed on recovery — nothing is lost.
# ----------------------------------------------------------------------------
relay:
  announce: true           # Stage 1: instant QR_SEEN on first decode
  announce_window_s: 6.0   # ...resent for this long (packet-loss cover)
  announce_interval_s: 1.5
  on_confirm: true         # Stage 2: official QR relay at confirm time
  interval_s: 2.0          # QR:<payload> resend cadence to MP
  window_s: 15.0           # ... for this long
  store_forward: true
  store_path: logs/pending_results.jsonl
  flush_poll_s: 5.0
